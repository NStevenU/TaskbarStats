name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Publish (self-contained)
        run: dotnet publish TaskbarStats.csproj -c Release -r win-x64 --self-contained -p:Version=${{ steps.v.outputs.version }} -o publish
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" "/DSourceDir=..\publish" installer\TaskbarStats.iss
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath dist\TaskbarStats-${{ steps.v.outputs.version }}-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarStats
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
